<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="metal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f6dc94"/>
      <stop offset="0.55" stop-color="#c49a45"/>
      <stop offset="1" stop-color="#6b4d16"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#3a2414"/>
      <stop offset="1" stop-color="#1c120b"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="204" y="204" width="104" height="104" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g filter="url(#shadow)" mask="url(#cut)">
    <circle cx="256" cy="256" r="190" fill="url(#metal)"/>
    <circle cx="256" cy="256" r="171" fill="none" stroke="#6b4d16" stroke-opacity="0.6" stroke-width="9"/>
    <circle cx="256" cy="256" r="159.6" fill="none" stroke="#f6dc94" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  <rect x="196" y="196" width="120" height="120"
        fill="none" stroke="#6b4d16" stroke-opacity="0.65" stroke-width="8"/>
</svg>