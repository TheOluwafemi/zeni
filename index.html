<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c120b" />
    <title>Zeni</title>
    <link rel="stylesheet" href="/client/style.css" />
  </head>
  <body>
    <main id="app">
      <section class="player" data-seat="1">
        <span class="turn-dot" aria-hidden="true"></span>
        <span class="name">Player 2</span>
        <span class="pips" aria-hidden="true"></span>
        <span class="score" aria-label="Coins kept">0</span>
      </section>

      <div id="board-wrap">
        <canvas id="board" aria-label="Game board"></canvas>
      </div>

      <section class="player" data-seat="0">
        <span class="turn-dot" aria-hidden="true"></span>
        <span class="name">Player 1</span>
        <span class="pips" aria-hidden="true"></span>
        <span class="score" aria-label="Coins kept">0</span>
      </section>

      <footer>
        <p id="message" aria-live="polite"></p>
        <label class="opponent">
          Play against
          <select id="opponent">
            <option value="friend">A friend on this device</option>
            <option value="beginner">Computer · Beginner</option>
            <option value="skilled">Computer · Skilled</option>
            <option value="master">Computer · Master</option>
          </select>
        </label>
        <div class="new-game" role="group" aria-label="New game">
          <button type="button" data-difficulty="easy">Easy · 2 cups</button>
          <button type="button" data-difficulty="hard">Hard · 4 cups</button>
        </div>
      </footer>

      <div id="result" hidden>
        <div class="card">
          <h2 id="result-title"></h2>
          <p id="result-score"></p>
          <button id="play-again" type="button">Play again</button>
        </div>
      </div>

      <aside id="tune" hidden></aside>
    </main>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
